<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#EEF3F4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1C27" media="(prefers-color-scheme: dark)" />
    <title>Helm</title>
    <meta name="description" content="A calm, live task board for you and your AI agents." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Helm" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      // Theme before first paint, so the page doesn't flash Harbor first (see src/ui/themes.ts).
      try {
        var theme = localStorage.getItem('helm.theme');
        if (theme && /^[a-z]+$/.test(theme)) document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
